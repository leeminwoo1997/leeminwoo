{% extends "base.html" %}

{% block title %}마이페이지 - VIBE FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="rounded-circle bg-dark text-white p-3 me-3 d-flex align-items-center justify-content-center" style="width: 56px; height: 56px;">
                        <i class="bi bi-person-fill fs-3"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">마이페이지</h4>
                        <span class="badge bg-success-subtle text-success border border-success-subtle mt-1">인증 회원</span>
                    </div>
                </div>

                <!-- 에러 알림 -->
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div>{{ error }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- 성공 알림 -->
                {% if success %}
                <div class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <div>{{ success }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <div class="list-group list-group-flush border-top border-bottom my-3">
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3 bg-transparent">
                        <span class="text-muted fw-semibold">로그인 이메일</span>
                        <span class="fw-bold text-dark">{{ user_email or '알 수 없음' }}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3 bg-transparent">
                        <span class="text-muted fw-semibold">회원 ID (UUID)</span>
                        <span class="small font-monospace text-muted">{{ user_id or '-' }}</span>
                    </div>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                    <a href="{{ url_for('auth.reset_password') }}" class="btn btn-outline-secondary py-2 flex-grow-1 rounded-3">
                        <i class="bi bi-shield-lock me-1"></i> 비밀번호 변경
                    </a>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger py-2 flex-grow-1 rounded-3">
                        <i class="bi bi-box-arrow-right me-1"></i> 로그아웃
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
