{% extends "base.html" %}

{% block title %}새 비밀번호 설정 - Young Style{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">새 비밀번호 설정</h3>
                    <p class="text-muted small">새로 사용할 안전한 비밀번호를 입력해주세요.</p>
                </div>

                <!-- 에러 알림 -->
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div>{{ error }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- 성공 알림 -->
                {% if success %}
                <div class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <div>{{ success }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.reset_password') }}" class="needs-validation">
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">새 비밀번호</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="영문, 숫자 포함 6자리 이상" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password_confirm" class="form-label fw-semibold">새 비밀번호 확인</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" minlength="6" placeholder="비밀번호를 한 번 더 입력하세요" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold rounded-3">비밀번호 변경</button>
                    </div>
                </form>

                <hr class="my-4 text-muted">

                <div class="text-center small">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i> 로그인으로 돌아가기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
