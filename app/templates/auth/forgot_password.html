{% extends "base.html" %}

{% block title %}비밀번호 찾기 - VIBE FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">비밀번호 찾기</h3>
                    <p class="text-muted small">가입하신 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
                </div>

                <!-- 에러 알림 -->
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div>{{ error }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- 성공 알림 -->
                {% if success %}
                <div class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <div>{{ success }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="needs-validation">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">이메일 주소</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required autofocus>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold rounded-3">재설정 메일 발송</button>
                    </div>
                </form>

                <hr class="my-4 text-muted">

                <div class="text-center small">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i> 로그인으로 돌아가기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
